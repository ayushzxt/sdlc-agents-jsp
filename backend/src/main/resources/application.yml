spring:
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  datasource:
    url: jdbc:h2:mem:leave_management;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:localhost}
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
leave-management:
  attachment-max-bytes: 5242880
  notification-from: ${MAIL_FROM:no-reply@example.invalid}